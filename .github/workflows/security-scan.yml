# Mirrors GroceryMate (ay5lee/groceryApp) Security scan:
# Trivy image + filesystem scans, Markdown report at docs/security-report.md,
# auto-committed by github-actions[bot] with [skip ci].
name: Security scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push report updates back to the PR branch (or main on push).
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Build proxy image
        run: docker build -f Dockerfile.proxy -t skyview-proxy:scan .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t skyview-frontend:scan .

      - name: Trivy scan proxy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skyview-proxy:scan
          format: table
          output: trivy-proxy.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skyview-frontend:scan
          format: table
          output: trivy-frontend.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Write docs/security-report.md
        run: |
          mkdir -p docs
          {
            echo "# Security scan report"
            echo
            echo "_Auto-generated by the Security scan workflow. Do not edit by hand._"
            echo
            echo "Generated: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
            echo "## Proxy image (\`skyview-proxy:scan\`)"
            echo
            echo '```'
            cat trivy-proxy.txt
            echo '```'
            echo
            echo "## Frontend image (\`skyview-frontend:scan\`)"
            echo
            echo '```'
            cat trivy-frontend.txt
            echo '```'
            echo
            echo "## Filesystem"
            echo
            echo '```'
            cat trivy-fs.txt
            echo '```'
          } > docs/security-report.md

      - name: Commit security report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security-report.md
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: update docs/security-report.md [skip ci]"
            git push
          fi
