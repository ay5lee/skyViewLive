services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    volumes:
      - route_cache:/app/cache

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY}
    depends_on:
      - proxy

volumes:
  route_cache:
