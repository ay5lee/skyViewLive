server {
    # Non-root nginx cannot bind :80; host still maps 8080 via Compose.
    listen 8080;

    location /api/ {
        proxy_pass http://proxy:8765/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
